<title>Grupo Llama · Menú</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Kaushan+Script&family=Metamorphous&family=Roboto+Slab:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--card:#151515;--line:#2a2a2a;--tx:#fff;--mut:#b9b9b9;--gold:#f4a916;--red:#e5222d;--wa:#25d366;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#1b1b1b,var(--bg) 60%);color:var(--tx);font-family:'Roboto Slab',Georgia,serif;padding-bottom:110px}
header{text-align:center;padding:20px 16px 4px}

.script{font-family:'Kaushan Script',cursive;font-size:2.2rem;margin:6px 0 0;line-height:1}
.badge{display:inline-block;background:var(--gold);color:#111;font-family:'Fredoka',sans-serif;font-weight:700;font-size:2.4rem;padding:0 26px;transform:rotate(-2deg);margin-top:-6px;clip-path:polygon(2% 10%,100% 0,97% 90%,0 100%)}
main{max-width:720px;margin:0 auto;padding:0 14px}
h2{font-family:'Fredoka',sans-serif;color:var(--gold);font-size:1.8rem;margin:28px 0 10px;display:flex;align-items:center;gap:12px}
h2 img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--gold)}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
.info{flex:1}
.info b{font-size:1.05rem}
.info p{margin:4px 0 0;color:var(--mut);font-size:.8rem;line-height:1.35}
.price{font-family:'Fredoka',sans-serif;color:var(--gold);font-weight:600;font-size:1.25rem;white-space:nowrap}
.ctl{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
button{font-family:'Fredoka',sans-serif;cursor:pointer;border:0}
.add{background:var(--red);color:#fff;font-size:.95rem;font-weight:600;padding:8px 16px;border-radius:20px}
.add:active{transform:scale(.95)}
.qty{display:flex;align-items:center;gap:10px;background:#222;border-radius:20px;padding:3px}
.qty button{width:30px;height:30px;border-radius:50%;background:var(--red);color:#fff;font-size:1.2rem;line-height:1}
.qty span{min-width:18px;text-align:center;font-weight:600}
#bar{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,#000 40%);display:none;z-index:5}
#bar button{display:flex;justify-content:space-between;width:100%;max-width:720px;margin:0 auto;background:var(--red);color:#fff;font-size:1.1rem;font-weight:600;padding:14px 20px;border-radius:30px;box-shadow:0 0 20px #e5222d66}
#sheet{position:fixed;inset:0;background:#000b;display:none;z-index:10;align-items:flex-end;justify-content:center}
#sheet.on{display:flex}
.panel{background:#111;border-top:3px solid var(--red);border-radius:20px 20px 0 0;width:100%;max-width:720px;max-height:92%;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.panel h3{font-family:'Fredoka',sans-serif;color:var(--gold);font-size:1.5rem;margin:0 0 10px;display:flex;justify-content:space-between}
.panel h3 button{background:none;color:#fff;font-size:1.6rem}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.total{display:flex;justify-content:space-between;font-family:'Fredoka',sans-serif;font-size:1.4rem;margin:12px 0}
.total b{color:var(--gold)}
label{display:block;font-size:.8rem;color:var(--mut);margin:10px 0 4px}
input,textarea,select{width:100%;background:#1c1c1c;border:1px solid var(--line);color:#fff;border-radius:10px;padding:10px;font:inherit;font-size:16px}
.send{width:100%;margin-top:16px;background:var(--wa);color:#06260f;font-size:1.15rem;font-weight:700;padding:14px;border-radius:30px}
.send:disabled{opacity:.4}
.empty{color:var(--mut);text-align:center;padding:20px}
footer{text-align:center;color:var(--mut);font-size:.8rem;padding:24px 10px}

.stage{position:relative;width:min(380px,82vw);aspect-ratio:425/280;margin:0 auto;perspective:900px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.rig{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .15s ease-out}
.pc{position:absolute;mix-blend-mode:screen;object-fit:fill;will-change:transform,opacity}
.pc.fork{animation:inF 1.4s cubic-bezier(.2,.8,.2,1) both,swF 6s 1.4s ease-in-out infinite}
.pc.knife{animation:inK 1.4s cubic-bezier(.2,.8,.2,1) both,swK 6s 1.4s ease-in-out infinite}
.pc.drag{animation:inD 1.8s cubic-bezier(.2,.9,.2,1) both,swD 6s 1.8s ease-in-out infinite,glow 3s 1.8s ease-in-out infinite}
.pc.txt{animation:inT 1s 1.3s ease-out both}
@keyframes inF{from{opacity:0;transform:translate3d(-220%,-40%,-300px) rotateY(-540deg) rotateZ(-30deg)}to{opacity:1;transform:none}}
@keyframes inK{from{opacity:0;transform:translate3d(220%,-40%,-300px) rotateY(540deg) rotateZ(30deg)}to{opacity:1;transform:none}}
@keyframes inD{0%{opacity:0;transform:scale(.05) rotateY(-720deg)}60%{opacity:1}to{opacity:1;transform:none}}
@keyframes inT{from{opacity:0;transform:translateY(40px) rotateX(-70deg)}to{opacity:1;transform:none}}
@keyframes swF{50%{transform:translateZ(30px) rotateY(18deg)}}
@keyframes swK{50%{transform:translateZ(30px) rotateY(-18deg)}}
@keyframes swD{0%,100%{transform:translateZ(50px) rotateY(-14deg)}50%{transform:translateZ(50px) rotateY(14deg)}}
@keyframes glow{50%{filter:drop-shadow(0 0 14px #e5222d)}}
.socials{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:10px 0}
.socials a{color:#fff;text-decoration:none;font-family:'Fredoka',sans-serif;border:1px solid var(--gold);border-radius:20px;padding:8px 16px;font-size:.95rem}
@media (prefers-reduced-motion:reduce){.pc{animation:none!important}}
.cus{background:none;border:1px solid var(--gold);color:var(--gold);font-size:.78rem;padding:6px 10px;border-radius:16px}
.inb{display:block;color:var(--gold);margin-top:4px;font-family:'Fredoka',sans-serif}
.sin{color:#ff7b82;font-size:.78rem;margin-top:2px}
#mod{position:fixed;inset:0;background:#000c;display:none;z-index:20;align-items:flex-end;justify-content:center}
#mod.on{display:flex}
#mc{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{margin:0;display:block;color:#fff;font-size:.9rem;cursor:pointer}
.chip input{display:none}
.chip span{display:block;padding:8px 14px;border-radius:20px;background:#1f1f1f;border:1px solid var(--gold)}
.chip input:not(:checked)+span{text-decoration:line-through;opacity:.5;border-color:var(--red);background:#2a1214}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:#000;border-bottom:2px solid var(--red);display:flex;justify-content:center;align-items:center;padding:5px 12px}
.top img{height:46px;width:auto;mix-blend-mode:screen}
#pv{background:var(--gold);color:#111;text-align:center;font-family:'Fredoka',sans-serif;padding:8px;font-size:.95rem}
#pv button{margin-left:8px;background:#111;color:#fff;border-radius:14px;padding:4px 12px}
.em{font-size:2.3rem;width:64px;text-align:center}
.ago{color:#ff7b82;font-family:'Fredoka',sans-serif;font-weight:600}
.item.off{opacity:.55}
input[type=checkbox]{width:auto}
.adl{color:#555;font-size:.7rem;text-decoration:none}
#admin{display:none;max-width:720px;margin:0 auto;padding:0 14px}
.adm #admin{display:block}
.adm header,.adm footer,.adm #bar,.adm #menu{display:none}
.adh h1{font-family:'Fredoka',sans-serif;color:var(--gold);margin:18px 0 6px}
.hint{color:var(--mut);font-size:.85rem;line-height:1.4}
.abtns{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.abtns button,.fb,.mb button{background:#222;color:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:.9rem;cursor:pointer;font-family:'Fredoka',sans-serif}
.abtns .pri{background:var(--red);border-color:var(--red)}
.sec{background:var(--card);border:1px solid var(--gold);border-radius:14px;padding:12px;margin:14px 0}
.sh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.sh input{flex:1;min-width:150px;font-family:'Fredoka',sans-serif;color:var(--gold);font-size:1.1rem}
.sh select{width:auto}
.mb{display:flex;gap:4px}
.mb button{padding:6px 10px}
.ai{border-top:1px solid var(--line);padding:10px 0;display:grid;gap:6px}
.r1{display:flex;gap:6px;align-items:center}
.r1 .p{width:90px}
.r2{display:flex;justify-content:space-between;align-items:center}

{id:"d6",n:"Orden hot dogs hawaianos con queso (3 pzas)",p:70,d:"",ing:[...H,"Queso"]}]},

]};
const EM={fries:"🍟"};
let live=DEFAULT,menu=DEFAULT,draft=null,previewing=false,L=[],all={},cur=null;
const $=id=>document.getElementById(id);
function build(){all={};menu.sections.forEach(s=>(s.items||[]).forEach(i=>all[i.id]=i))}
function render(){
 $("menu").innerHTML=menu.sections.map(s=>{
  const ic=IMG[s.img]?`<img src="${IMG[s.img]}" alt="">`:EM[s.img]?`<span class="em">${EM[s.img]}</span>`:"";
  return`<h2>${ic}${esc(s.t)}</h2>`+(s.items||[]).map(i=>`<div class="item${i.off?" off":""}"><div class="info"><b>${esc(i.n)}</b>${i.d?`<p>(${esc(i.d)})</p>`:""}<small class="inb" id="b-${i.id}"></small></div><div class="ctl"><span class="price">$${i.p}</span>${i.off?'<span class="ago">Agotado</span>':`<button class="add" onclick="add('${i.id}')">Agregar</button>${i.ing&&i.ing.length?`<button class="cus" onclick="openMod('${i.id}')">✎ Quitar ingredientes</button>`:""}`}</div></div>`).join("")}).join("");
}
function totals(){let n=0,t=0;L.forEach(l=>{n+=l.q;t+=l.q*all[l.id].p});return[n,t]}
function add(id,no=[]){
 const k=id+"|"+[...no].sort().join(",");const l=L.find(x=>x.k===k);
 if(l)l.q++;else L.push({k,id,no:[...no],q:1});
 update();
}
function chg(i,d){L[i].q+=d;if(L[i].q<=0)L.splice(i,1);update()}
function update(){
 L=L.filter(l=>all[l.id]);
 const[n,t]=totals();
 $("bar").style.display=n?"block":"none";
 $("bc").textContent=`🛒 Ver pedido (${n})`;$("bt").textContent="$"+t;
 Object.keys(all).forEach(id=>{const e=$("b-"+id);if(!e)return;const q=L.filter(l=>l.id===id).reduce((a,l)=>a+l.q,0);e.textContent=q?`En tu pedido: ${q}`:""});
 if($("sheet").classList.contains("on"))lines();
}
function lines(){
 const[n,t]=totals();
 $("lines").innerHTML=n?L.map((l,i)=>`<div class="row"><div style="flex:1">${esc(all[l.id].n)}${l.no.length?`<div class="sin">Sin: ${esc(l.no.join(", "))}</div>`:""}</div><div class="qty"><button onclick="chg(${i},-1)">−</button><span>${l.q}</span><button onclick="chg(${i},1)">+</button></div><b style="min-width:52px;text-align:right">$${l.q*all[l.id].p}</b></div>`).join(""):'<div class="empty">Tu pedido está vacío</div>';
 $("tot").textContent="$"+t;$("sd").disabled=!n;
 if(!n)closeCart();
}
function openCart(){$("sheet").classList.add("on");lines()}
function closeCart(){$("sheet").classList.remove("on")}
function openMod(id){
 cur=id;const it=all[id];
 $("mt").textContent=it.n;
 $("mh").textContent=/pzas/.test(it.n)?"Se aplica a las 3 piezas. Desmarca lo que NO quieres:":"Desmarca lo que NO quieres:";
 $("mc").innerHTML=it.ing.map((x,i)=>`<label class="chip"><input type="checkbox" checked data-i="${i}"><span>${esc(x)}</span></label>`).join("");
 $("mod").classList.add("on");
}
function closeMod(){$("mod").classList.remove("on")}
function addMod(){
 const no=[...document.querySelectorAll("#mc input:not(:checked)")].map(c=>all[cur].ing[c.dataset.i]);
 add(cur,no);closeMod();
}
function send(){
 const[n,t]=totals();if(!n)return;
 const dom=$("tp").value==="Domicilio";
 if(!$("nm").value.trim()){$("nm").focus();return}
 if(dom&&!$("ad").value.trim()){$("ad").focus();return}
 let m="🔥 *Pedido Grupo Llama* 🔥\n\n";
 L.forEach(l=>{const it=all[l.id];m+=`• ${l.q} x ${it.n} — $${l.q*it.p}\n`;if(l.no.length)m+=`   ❌ Sin: ${l.no.join(", ")}\n`});
 m+=`\n*Total: $${t}*\n\n👤 ${$("nm").value.trim()}\n🛵 ${$("tp").value}`;
 if(dom)m+=`\n📍 ${$("ad").value.trim()}`;
 if($("nt").value.trim())m+=`\n📝 ${$("nt").value.trim()}`;
 window.open(`https://wa.me/${WA}?text=${encodeURIComponent(m)}`,"_blank");
}
/* ---------- Editor del menú (#admin) ---------- */
const clone=o=>JSON.parse(JSON.stringify(o));
function loadDraft(){try{const d=JSON.parse(localStorage.getItem("gl_draft"));if(d&&Array.isArray(d.sections))return d}catch(e){}return clone(live)}
function sv(){try{localStorage.setItem("gl_draft",JSON.stringify(draft))}catch(e){}}
function msg(t){$("am").textContent=t}
function renderAdmin(){
 const opt=(v,l,s)=>`<option value="${v}"${(s||"")===v?" selected":""}>${l}</option>`;
 $("admin").innerHTML=`<div class="adh"><h1>Editar menú</h1><p class="hint">Cambia nombres, precios, descripciones y disponibilidad. Tus cambios se guardan como borrador en este navegador. Para publicarlos: descarga <b>menu.json</b> y súbelo a tu hosting junto a index.html, reemplazando el anterior.</p><div class="abtns"><button onclick="goMenu()">← Ver menú</button><button onclick="prev()">👁 Vista previa</button><button class="pri" onclick="dl()">⬇ Descargar menu.json</button><button onclick="cp()">📋 Copiar</button><label class="fb">📂 Cargar menu.json<input type="file" accept=".json,application/json" hidden onchange="ld(this)"></label><button onclick="resetD()">↺ Descartar borrador</button></div><div id="am" class="hint"></div></div>`
 +draft.sections.map((s,si)=>`<div class="sec"><div class="sh"><input value="${esc(s.t)}" oninput="US(${si},'t',this.value)" placeholder="Nombre de la sección"><select onchange="US(${si},'img',this.value)">${opt("burger","Foto hamburguesa",s.img)}${opt("hot","Foto hot dog",s.img)}${opt("fries","🍟 Ícono papas",s.img)}${opt("","Sin imagen",s.img)}</select><span class="mb"><button onclick="mvS(${si},-1)">↑</button><button onclick="mvS(${si},1)">↓</button><button onclick="delS(${si})">🗑</button></span></div>`
 +(s.items||[]).map((i,ii)=>`<div class="ai"><div class="r1"><input class="n" value="${esc(i.n)}" oninput="U(${si},${ii},'n',this.value)" placeholder="Producto"><span>$</span><input class="p" type="number" inputmode="decimal" min="0" value="${i.p}" oninput="U(${si},${ii},'p',this.value)"></div><textarea rows="2" oninput="U(${si},${ii},'d',this.value)" placeholder="Descripción que se muestra al cliente">${esc(i.d||"")}</textarea><input value="${esc((i.ing||[]).join(", "))}" oninput="U(${si},${ii},'ing',this.value)" placeholder="Ingredientes que el cliente puede quitar (separados por coma)"><div class="r2"><label><input type="checkbox"${i.off?" checked":""} onchange="U(${si},${ii},'off',this.checked)"> Agotado</label><span class="mb"><button onclick="mvI(${si},${ii},-1)">↑</button><button onclick="mvI(${si},${ii},1)">↓</button><button onclick="delI(${si},${ii})">🗑</button></span></div></div>`).join("")
 +`<button class="addb" onclick="addI(${si})">+ Agregar producto</button></div>`).join("")
 +`<button class="addb" onclick="addS()">+ Agregar sección</button>`;
}
function U(si,ii,k,v){const it=draft.sections[si].items[ii];if(k==="p")v=Math.max(0,parseFloat(v)||0);if(k==="ing")v=v.split(",").map(x=>x.trim()).filter(Boolean);it[k]=v;sv()}
function US(si,k,v){draft.sections[si][k]=v;sv()}
function mv(a,i,d){const j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];sv();renderAdmin()}
function mvS(si,d){mv(draft.sections,si,d)}
function mvI(si,ii,d){mv(draft.sections[si].items,ii,d)}
function delS(si){draft.sections.splice(si,1);sv();renderAdmin()}
function delI(si,ii){draft.sections[si].items.splice(ii,1);sv();renderAdmin()}
function addI(si){draft.sections[si].items.push({id:"p"+Date.now().toString(36),n:"Nuevo producto",p:0,d:"",ing:[]});sv();renderAdmin()}
function addS(){draft.sections.push({t:"Nueva sección",img:"",items:[]});sv();renderAdmin()}
function resetD(){try{localStorage.removeItem("gl_draft")}catch(e){}draft=clone(live);renderAdmin();msg("Borrador descartado.")}
const json=()=>JSON.stringify(draft,null,2);
function dl(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([json()],{type:"application/json"}));a.download="menu.json";document.body.appendChild(a);a.click();a.remove();msg("Se descargó menu.json. Súbelo a tu hosting para publicar los cambios.")}
function cp(){const t=json();(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>msg("Copiado. Pégalo en un archivo llamado menu.json.")).catch(()=>{$("am").innerHTML='Copia este texto y guárdalo como menu.json:<textarea readonly rows="8" onfocus="this.select()">'+esc(t)+'</textarea>'})}
function ld(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.sections))throw 0;d.sections.forEach(s=>s.items=s.items||[]);draft=d;sv();renderAdmin();msg("menu.json cargado.")}catch(e){msg("Ese archivo no es un menu.json válido.")}};r.readAsText(f)}
function prev(){previewing=true;location.hash=""}
function goMenu(){previewing=false;location.hash=""}
function backEdit(){location.hash="#admin"}
function route(){
 const a=location.hash==="#admin";
 document.body.classList.toggle("adm",a);
 if(a){previewing=false;draft=draft||loadDraft();renderAdmin()}
 else{menu=previewing?draft:live;build();render();update()}
 $("pv").style.display=(!a&&previewing)?"block":"none";
 window.scrollTo(0,0);
}
addEventListener("hashchange",route);
async function boot(){
 try{const r=await fetch("menu.json?v="+Date.now(),{cache:"no-store"});if(r.ok){const d=await r.json();if(d&&Array.isArray(d.sections)){d.sections.forEach(s=>s.items=s.items||[]);live=d;draft=null;route()}}}catch(e){}
}
route();boot();

const stg=document.getElementById('stage'),rig=document.getElementById('rig');
stg.addEventListener('pointermove',e=>{const r=stg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;rig.style.transform=`rotateY(${x*30}deg) rotateX(${-y*22}deg)`});
stg.addEventListener('pointerleave',()=>rig.style.transform='');
stg.addEventListener('click',()=>{rig.querySelectorAll('.pc').forEach(p=>{p.style.animation='none';void p.offsetWidth;p.style.animation=''})});
render();
</script>
</body>
</html>
