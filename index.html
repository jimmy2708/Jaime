<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grupo Llama · Menú</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Kaushan+Script&family=Metamorphous&family=Roboto+Slab:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--card:#151515;--line:#2a2a2a;--tx:#fff;--mut:#b9b9b9;--gold:#f4a916;--red:#e5222d;--wa:#25d366;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#1b1b1b,var(--bg) 60%);color:var(--tx);font-family:'Roboto Slab',Georgia,serif;padding-bottom:110px}
header{text-align:center;padding:20px 16px 4px}

.script{font-family:'Kaushan Script',cursive;font-size:2.2rem;margin:6px 0 0;line-height:1}
.badge{display:inline-block;background:var(--gold);color:#111;font-family:'Fredoka',sans-serif;font-weight:700;font-size:2.4rem;padding:0 26px;transform:rotate(-2deg);margin-top:-6px;clip-path:polygon(2% 10%,100% 0,97% 90%,0 100%)}
main{max-width:720px;margin:0 auto;padding:0 14px}
h2{font-family:'Fredoka',sans-serif;color:var(--gold);font-size:1.8rem;margin:28px 0 10px;display:flex;align-items:center;gap:12px}
h2 img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--gold)}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
.info{flex:1}
.info b{font-size:1.05rem}
.info p{margin:4px 0 0;color:var(--mut);font-size:.8rem;line-height:1.35}
.price{font-family:'Fredoka',sans-serif;color:var(--gold);font-weight:600;font-size:1.25rem;white-space:nowrap}
.ctl{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
button{font-family:'Fredoka',sans-serif;cursor:pointer;border:0}
.add{background:var(--red);color:#fff;font-size:.95rem;font-weight:600;padding:8px 16px;border-radius:20px}
.add:active{transform:scale(.95)}
.qty{display:flex;align-items:center;gap:10px;background:#222;border-radius:20px;padding:3px}
.qty button{width:30px;height:30px;border-radius:50%;background:var(--red);color:#fff;font-size:1.2rem;line-height:1}
.qty span{min-width:18px;text-align:center;font-weight:600}
#bar{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,#000 40%);display:none;z-index:5}
#bar button{display:flex;justify-content:space-between;width:100%;max-width:720px;margin:0 auto;background:var(--red);color:#fff;font-size:1.1rem;font-weight:600;padding:14px 20px;border-radius:30px;box-shadow:0 0 20px #e5222d66}
#sheet{position:fixed;inset:0;background:#000b;display:none;z-index:10;align-items:flex-end;justify-content:center}
#sheet.on{display:flex}
.panel{background:#111;border-top:3px solid var(--red);border-radius:20px 20px 0 0;width:100%;max-width:720px;max-height:92%;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.panel h3{font-family:'Fredoka',sans-serif;color:var(--gold);font-size:1.5rem;margin:0 0 10px;display:flex;justify-content:space-between}
.panel h3 button{background:none;color:#fff;font-size:1.6rem}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.total{display:flex;justify-content:space-between;font-family:'Fredoka',sans-serif;font-size:1.4rem;margin:12px 0}
.total b{color:var(--gold)}
label{display:block;font-size:.8rem;color:var(--mut);margin:10px 0 4px}
input,textarea,select{width:100%;background:#1c1c1c;border:1px solid var(--line);color:#fff;border-radius:10px;padding:10px;font:inherit;font-size:16px}
.send{width:100%;margin-top:16px;background:var(--wa);color:#06260f;font-size:1.15rem;font-weight:700;padding:14px;border-radius:30px}
.send:disabled{opacity:.4}
.empty{color:var(--mut);text-align:center;padding:20px}
footer{text-align:center;color:var(--mut);font-size:.8rem;padding:24px 10px}

.stage{position:relative;width:min(380px,82vw);aspect-ratio:425/280;margin:0 auto;perspective:900px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.rig{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .15s ease-out}
.pc{position:absolute;mix-blend-mode:screen;object-fit:fill;will-change:transform,opacity}
.pc.fork{animation:inF 1.4s cubic-bezier(.2,.8,.2,1) both,swF 6s 1.4s ease-in-out infinite}
.pc.knife{animation:inK 1.4s cubic-bezier(.2,.8,.2,1) both,swK 6s 1.4s ease-in-out infinite}
.pc.drag{animation:inD 1.8s cubic-bezier(.2,.9,.2,1) both,swD 6s 1.8s ease-in-out infinite,glow 3s 1.8s ease-in-out infinite}
.pc.txt{animation:inT 1s 1.3s ease-out both}
@keyframes inF{from{opacity:0;transform:translate3d(-220%,-40%,-300px) rotateY(-540deg) rotateZ(-30deg)}to{opacity:1;transform:none}}
@keyframes inK{from{opacity:0;transform:translate3d(220%,-40%,-300px) rotateY(540deg) rotateZ(30deg)}to{opacity:1;transform:none}}
@keyframes inD{0%{opacity:0;transform:scale(.05) rotateY(-720deg)}60%{opacity:1}to{opacity:1;transform:none}}
@keyframes inT{from{opacity:0;transform:translateY(40px) rotateX(-70deg)}to{opacity:1;transform:none}}
@keyframes swF{50%{transform:translateZ(30px) rotateY(18deg)}}
@keyframes swK{50%{transform:translateZ(30px) rotateY(-18deg)}}
@keyframes swD{0%,100%{transform:translateZ(50px) rotateY(-14deg)}50%{transform:translateZ(50px) rotateY(14deg)}}
@keyframes glow{50%{filter:drop-shadow(0 0 14px #e5222d)}}
.socials{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:10px 0}
.socials a{color:#fff;text-decoration:none;font-family:'Fredoka',sans-serif;border:1px solid var(--gold);border-radius:20px;padding:8px 16px;font-size:.95rem}
@media (prefers-reduced-motion:reduce){.pc{animation:none!important}}
.cus{background:none;border:1px solid var(--gold);color:var(--gold);font-size:.78rem;padding:6px 10px;border-radius:16px}
.inb{display:block;color:var(--gold);margin-top:4px;font-family:'Fredoka',sans-serif}
.sin{color:#ff7b82;font-size:.78rem;margin-top:2px}
#mod{position:fixed;inset:0;background:#000c;display:none;z-index:20;align-items:flex-end;justify-content:center}
#mod.on{display:flex}
#mc{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{margin:0;display:block;color:#fff;font-size:.9rem;cursor:pointer}
.chip input{display:none}
.chip span{display:block;padding:8px 14px;border-radius:20px;background:#1f1f1f;border:1px solid var(--gold)}
.chip input:not(:checked)+span{text-decoration:line-through;opacity:.5;border-color:var(--red);background:#2a1214}
</style>
</head>

const S=["Tomate","Cebolla","Chile","Catsup","Mostaza","Mayonesa"];
const H=["Tocino","Tomate","Cebolla","Chile","Piña","Catsup","Mostaza","Mayonesa"];
const B=["Lechuga","Queso amarillo","Tomate","Cebolla","Chile","Catsup","Mostaza","Mayonesa"];
const MENU=[
{t:"Hamburguesas",img:"burger",items:[
["h1","Hamburguesa sencilla",50,"Lechuga, queso amarillo, tomate, cebolla, chile, catsup, mostaza, mayonesa",B],
["h2","Hamburguesa hawaiana",65,"Lechuga, base de salchicha, queso amarillo, tocino, tomate, cebolla, chile, piña, catsup, mostaza y mayonesa",["Lechuga","Queso amarillo",...H]],
["h3","Hamburguesa doble",80,"Lechuga, queso amarillo, tomate, cebolla, chile, catsup, mostaza y mayonesa",B],
["h4","Hamburguesa quesuda",90,"Lechuga, carne, jamón o tocino, queso amarillo, tomate, cebolla, queso de hebra, chile, catsup y queso manchego",["Lechuga","Jamón o tocino","Queso amarillo","Tomate","Cebolla","Queso de hebra","Chile","Catsup","Queso manchego"]]]},
{t:"Hot dogs",img:"hot",items:[
["d1","Hot dog sencillo",20,"Tomate, cebolla, chile, catsup, mostaza y mayonesa",S],
["d2","Orden sencilla (3 pzas)",50,"",S],
["d3","Hot dog hawaiano",25,"Tocino, tomate, cebolla, chile, piña, catsup, mostaza, mayonesa",H],
["d4","Orden hawaiana (3 pzas)",65,"",H],
["d5","Hot dog hawaiano con queso",27,"",[...H,"Queso"]],
["d6","Orden hot dogs hawaianos con queso (3 pzas)",70,"",[...H,"Queso"]]]}
];
const L=[],all={};let cur=null;
const $=id=>document.getElementById(id);
function render(){
 $("menu").innerHTML=MENU.map(s=>`<h2><img src="${IMG[s.img]}" alt="">${s.t}</h2>`+s.items.map(i=>{all[i[0]]=i;return`<div class="item"><div class="info"><b>${i[1]}</b>${i[3]?`<p>(${i[3]})</p>`:""}<small class="inb" id="b-${i[0]}"></small></div><div class="ctl"><span class="price">$${i[2]}</span><button class="add" onclick="add('${i[0]}')">Agregar</button><button class="cus" onclick="openMod('${i[0]}')">✎ Quitar ingredientes</button></div></div>`}).join("")).join("");
}
function totals(){let n=0,t=0;L.forEach(l=>{n+=l.q;t+=l.q*all[l.id][2]});return[n,t]}
function add(id,no=[]){
 const k=id+"|"+[...no].sort().join(",");const l=L.find(x=>x.k===k);
 if(l)l.q++;else L.push({k,id,no:[...no],q:1});
 update();
}
function chg(i,d){L[i].q+=d;if(L[i].q<=0)L.splice(i,1);update()}
function update(){
 const[n,t]=totals();
 $("bar").style.display=n?"block":"none";
 $("bc").textContent=`🛒 Ver pedido (${n})`;$("bt").textContent="$"+t;
 Object.keys(all).forEach(id=>{const q=L.filter(l=>l.id===id).reduce((a,l)=>a+l.q,0);$("b-"+id).textContent=q?`En tu pedido: ${q}`:""});
 if($("sheet").classList.contains("on"))lines();
}
function lines(){
 const[n,t]=totals();
 $("lines").innerHTML=n?L.map((l,i)=>`<div class="row"><div style="flex:1">${all[l.id][1]}${l.no.length?`<div class="sin">Sin: ${l.no.join(", ")}</div>`:""}</div><div class="qty"><button onclick="chg(${i},-1)">−</button><span>${l.q}</span><button onclick="chg(${i},1)">+</button></div><b style="min-width:52px;text-align:right">$${l.q*all[l.id][2]}</b></div>`).join(""):'<div class="empty">Tu pedido está vacío</div>';
 $("tot").textContent="$"+t;$("sd").disabled=!n;
 if(!n)closeCart();
}
function openCart(){$("sheet").classList.add("on");lines()}
function closeCart(){$("sheet").classList.remove("on")}
function openMod(id){
 cur=id;const it=all[id];
 $("mt").textContent=it[1];
 $("mh").textContent=/pzas/.test(it[1])?"Se aplica a las 3 piezas. Desmarca lo que NO quieres:":"Desmarca lo que NO quieres:";
 $("mc").innerHTML=it[4].map((x,i)=>`<label class="chip"><input type="checkbox" checked data-i="${i}"><span>${x}</span></label>`).join("");
 $("mod").classList.add("on");
}
function closeMod(){$("mod").classList.remove("on")}
function addMod(){
 const no=[...document.querySelectorAll("#mc input:not(:checked)")].map(c=>all[cur][4][c.dataset.i]);
 add(cur,no);closeMod();
}
function send(){
 const[n,t]=totals();if(!n)return;
 const dom=$("tp").value==="Domicilio";
 if(!$("nm").value.trim()){$("nm").focus();return}
 if(dom&&!$("ad").value.trim()){$("ad").focus();return}
 let m="🔥 *Pedido Grupo Llama* 🔥\n\n";
 L.forEach(l=>{m+=`• ${l.q} x ${all[l.id][1]} — $${l.q*all[l.id][2]}\n`;if(l.no.length)m+=`   ❌ Sin: ${l.no.join(", ")}\n`});
 m+=`\n*Total: $${t}*\n\n👤 ${$("nm").value.trim()}\n🛵 ${$("tp").value}`;
 if(dom)m+=`\n📍 ${$("ad").value.trim()}`;
 if($("nt").value.trim())m+=`\n📝 ${$("nt").value.trim()}`;
 window.open(`https://wa.me/${WA}?text=${encodeURIComponent(m)}`,"_blank");
}
render();

const stg=document.getElementById('stage'),rig=document.getElementById('rig');
stg.addEventListener('pointermove',e=>{const r=stg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;rig.style.transform=`rotateY(${x*30}deg) rotateX(${-y*22}deg)`});
stg.addEventListener('pointerleave',()=>rig.style.transform='');
stg.addEventListener('click',()=>{rig.querySelectorAll('.pc').forEach(p=>{p.style.animation='none';void p.offsetWidth;p.style.animation=''})});
render();
</script>
</body>
